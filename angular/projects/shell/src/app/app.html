<div class="shell">
  <header class="shell__header">
    <a routerLink="/" class="shell__brand">Online Store</a>
    <nav class="shell__nav">
      <a routerLink="/catalog" routerLinkActive="active">Catalog</a>
      <a routerLink="/cart" routerLinkActive="active">Cart ({{ cart.itemCount() }})</a>
      <a routerLink="/checkout" routerLinkActive="active">Checkout</a>
      <a routerLink="/recipe-box" routerLinkActive="active">Recipe Box</a>
    </nav>
    <div class="shell__auth">
      @if (auth.isAuthenticated()) {
        <span>{{ auth.user()?.displayName }}</span>
        <button type="button" (click)="auth.logout()">Logout</button>
      } @else {
        <button type="button" (click)="demoLogin()">Demo login</button>
      }
    </div>
  </header>
  <main class="shell__main">
    <router-outlet />
  </main>
</div>
